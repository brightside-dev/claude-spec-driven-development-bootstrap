# Supabase local dev config for {{PROJECT_TITLE}}.
# `supabase start` reads this and boots the full local stack (Postgres, Auth,
# Storage, Studio) in Docker. `supabase stop` tears it down.

project_id = "{{PROJECT_NAME}}"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["io.supabase.{{PROJECT_NAME}}://login-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
